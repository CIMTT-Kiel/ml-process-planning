# ============================================================
# Basis-Konfiguration (wird von allen Task-Configs geerbt)
# Aufgaben-spezifische Configs überschreiben einzelne Werte.
# ============================================================

mlflow:
  tracking_uri: "https://cimtt-ki.haw-kiel.de/mlflow/"

data:
  batch_size: 85
  num_workers: 4
  input_type: "vecset"
  # target_type wird in der jeweiligen Task-Config gesetzt

training:
  n_trials: 20          # Anzahl Optuna-Trials für Hyperparameter-Tuning
  tuning_epochs: 50     # Max. Epochen pro Tuning-Trial
  final_epochs: 1000    # Max. Epochen für das finale Best-Model Training
  tuning_patience: 10   # EarlyStopping-Patience beim Tuning
  final_patience: 30    # EarlyStopping-Patience beim finalen Training
  log_every_n_steps: 1
  weight_decay: 0.01
