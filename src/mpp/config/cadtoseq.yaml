# ============================================================
# Konfiguration: Sequenzvorhersage (cadtoseq)
# Erbt von config/base.yaml, überschreibt task-spezifische Werte.
# ============================================================

mlflow:
  experiment_name: "cadtoseq"
  tuning_experiment_name: "cadtoseq-hyperparameter-tuning"

data:
  target_type: "seq"

training:
  gpu_id: 0             # GPU-Index (0 oder 1)
  tuning_epochs: 35      # Mit patience=8 reichen ~17 Epochen bis Early Stop → Puffer für langsame Trials
  final_epochs: 1000
  tuning_patience: 8     # Schnellerer Exit; spart ~20% Zeit pro Trial ggü. patience=10
  plot_every_n_epochs: 5

checkpoint:
  tuning_subdir: "tuning/cadtoseq"
  best_subdir: "best_model/cadtoseq"
  filename: "cadtoseq-{epoch:02d}-{val_loss:.4f}"

hyperparameter_search:
  dropout:
    low: 0.1
    high: 0.5
  lr:
    low: 1.0e-5
    high: 1.0e-3
    log: true
  nhead:
    choices: [4, 8]
  num_layers:
    low: 2      # Für max. 6 Schritte aus 10 Token reichen 2 Layer
    high: 6     # Mehr als 6 Layer bringt kaum Mehrwert, kostet aber Zeit
  embed_dim:
    low: 128    # Minimum 128: bei nhead=8 → head_dim=16 (Flash Attention-Minimum)
    high: 256
    step: 64    # step=64 stellt sicher dass head_dim % 8 == 0 für alle nhead-Werte
