[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpp"
version = "1.1.0"
description = "mpp"
authors = [{ name = "Kruse Michel", email = "michel.kruse@fh-kiel.de" }]
requires-python = ">=3.10"

dependencies = [
  "torch>=2.1.0",
  "pytorch-lightning>=2.1.0",
  "hydra-core>=1.3.2",
  "mlflow>=2.10.0",
  "pyyaml>=6.0",
  "tqdm>=4.0",
  "scikit-learn",
  "torchvision",
  "pandas",
  "matplotlib",
  "seaborn",
  "optuna>=4.4.0",
  "client @ git+https://github.com/CIMTT-Kiel/cad-api-client.git@v1.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "coverage",
    "ruff",
    "ipython",
    "mypy",
    "black",
    "pre-commit",
]
notebook = [
    "jupyterlab",
    "ipykernel",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

